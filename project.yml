name: FGMacOSOptimizer
options:
  bundleIdPrefix: com.fgmacos
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ONLY_ACTIVE_ARCH: NO
targets:
  FGMacOSOptimizer:
    type: application
    platform: macOS
    sources:
      - path: FGMacOSOptimizer
        excludes:
          - "**/.DS_Store"
          - "Resources/AppIcon-1024.png"
          - "**/AppIcon-1024.png"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fgmacos.optimizer
        PRODUCT_NAME: FGMacOS Optimizer
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: FGMacOSOptimizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FGMacOSOptimizer/Resources/FGMacOSOptimizer.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: FGMacOSOptimizer/Resources/BridgingHeader.h
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        EXCLUDED_ARCHS: ""
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_LDFLAGS: "$(inherited) -lproc"
        LSUIElement: YES


    info:
      path: FGMacOSOptimizer/Resources/Info.plist
      properties:
        CFBundleName: FGMacOS Optimizer
        CFBundleDisplayName: FGMacOS Optimizer
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "4"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: FGMacOS Optimizer needs Automation access to pause Spotlight indexing and flush DNS cache when you enable Turbo Mode or Cleaner.
        NSUserNotificationsUsageDescription: FGMacOS Optimizer notifies you when apps consume excessive CPU so you can act quickly.
